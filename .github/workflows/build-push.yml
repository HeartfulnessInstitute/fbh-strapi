name: Build and Push Image to ECR

# Single build pipeline for the whole app: builds once from main and pushes
# to dev's ECR. Staging deploys the same image by referencing its tag
# directly (dev's ECR already grants staging's account cross-account pull —
# no separate staging build). Prod is a separate, manual promotion step
# after QA sign-off, not handled by this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 502390415551.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fbh/strapi

permissions:
  id-token: write
  contents: read

jobs:
  # Built natively per-architecture (no QEMU) — this Dockerfile compiles
  # native C/C++ modules (vips/sharp) from source, which is extremely slow
  # and prone to hanging under QEMU emulation on arm64.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version_tag: ${{ steps.tags.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502390415551:role/github-actions-fbh-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute next semantic version tag
        id: tags
        run: |
          # Auto-incrementing patch (v0.1.N) — replaces the old
          # v0.1.0-dev.{run_number} scheme, where "0.1.0" was a static
          # value read from package.json and never actually bumped, so the
          # tag only looked like semver (the run number was the only thing
          # that ever changed). Finds the highest existing v0.1.N tag in
          # ECR and increments the patch; starts at v0.1.1 if none exist
          # yet (old "-dev.N"-style tags don't match this pattern, so they
          # won't collide with the new numbering). Same mechanism as
          # short-message-proxy's build-push-eks.yml. Runs identically in
          # both matrix legs (amd64/arm64) — deterministic given the same
          # ECR state, so both compute the same tag for the merge step.
          # No 2>/dev/null on purpose — a permission/API error must fail
          # loudly, not silently fall back to v0.1.1 and collide with an
          # already-pushed immutable tag.
          DESCRIBE_OUTPUT=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'imageDetails[].imageTags[]' --output text)

          LATEST=$(echo "$DESCRIBE_OUTPUT" \
            | tr '\t' '\n' \
            | grep -E '^v0\.1\.[0-9]+$' \
            | sed 's/^v0\.1\.//' \
            | sort -n \
            | tail -1 || true)

          if [ -z "$LATEST" ]; then
            NEXT="v0.1.1"
          else
            NEXT="v0.1.$((LATEST + 1))"
          fi

          echo "version_tag=$NEXT" >> $GITHUB_OUTPUT
          echo "Next tag: $NEXT"

      - name: Set platform pair
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the two single-arch images (by digest) into one multi-arch tag.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502390415551:role/github-actions-fbh-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.version_tag }} \
            $(printf '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@sha256:%s ' *)

      - name: Summary
        run: |
          echo "### Image pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.version_tag }}\`" >> $GITHUB_STEP_SUMMARY
