name: Build and Push to ECR (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 502390415551.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fbh/strapi

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    name: Build and Push (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502390415551:role/github-actions-fbh-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set semantic version tag
        id: tags
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version_tag=v${PKG_VERSION}-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Multi-arch so the same tag works whether nodes are x86 (t3) or
          # Graviton/ARM (t4g) — needed before any node group can switch to t4g.
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tags.outputs.version_tag }}

      - name: Summary
        run: |
          echo "### Image pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tags.outputs.version_tag }}\`" >> $GITHUB_STEP_SUMMARY
